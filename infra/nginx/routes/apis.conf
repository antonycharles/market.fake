location = /api/user {
    return 301 /api/user/;
}

location /api/user/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /api/user;
    proxy_pass http://userapi:8080/;
}

location = /api/accounts {
    return 301 /api/accounts/;
}

location /api/accounts/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /api/accounts;
    proxy_pass http://accountsapi:8080/;
}

location = /api/file {
    return 301 /api/file/;
}

location /api/file/ {
    proxy_pass http://fileapi:8080/;
}

location = /api/market {
    return 301 /api/market/;
}

location = /api/market/ {
    return 302 $scheme://$http_host/api/market/swagger/index.html;
}

location /api/market/ {
    proxy_pass http://marketapi:8080/;
}
