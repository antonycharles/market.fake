services:
    dbpostgresql:
        image: postgres:15-alpine
        deploy:
            resources:
                limits:
                    cpus: '0.50'
                    memory: 50M
        volumes:
            - db_postgresql:/var/lib/postgresql/data
        container_name: dbpostgresql
        networks:
            - market-network
        ports:
            - "5432:5432"
        environment:
            POSTGRES_PASSWORD: "Postgres2022!"

    message.broker.rabbitmq:
        build: ./infra/rabbitmq/
        container_name: messagebrokerrabbitmq
        ports:
            - "5672:5672"
            - "15672:15672"
        networks:
            - market-network
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
            - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
            - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro

    redis:
        image: redis:6.2-alpine
        container_name: redis
        deploy:
            resources:
                limits:
                    cpus: '0.50'
                    memory: 50M
        networks:
            - market-network
        ports:
            - '6379:6379'
        volumes: 
            - cache:/data
            
    mailhog:
        image: mailhog/mailhog
        container_name: mailhog
        ports:
        - "1025:1025" # SMTP
        - "8025:8025" # Web UI
        networks:
            - market-network

    userapi:
        build:
            context: ./user.api
            dockerfile: Dockerfile
        container_name: user-api
        ports:
            - "9500:8080"
        networks: 
            - market-network
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
        depends_on:
            - dbpostgresql
            - message.broker.rabbitmq
            - redis

    accountsapi:
        build:
            context: .
            dockerfile: ./accounts.api/Dockerfile
            args:
                GITHUB_PACKAGES_USERNAME: ${GITHUB_PACKAGES_USERNAME}
                GITHUB_PACKAGES_TOKEN: ${GITHUB_PACKAGES_TOKEN}
        container_name: accounts-api
        ports:
            - "9501:8080"
        networks: 
            - market-network
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
        depends_on:
            - dbpostgresql
            - message.broker.rabbitmq
            - redis

    fileapi:
        build:
            context: ./file.api
            dockerfile: Dockerfile
        container_name: file-api
        ports:
            - "9502:8080"
        networks: 
            - market-network
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
        volumes:
            - uploads:/app/Uploads
        depends_on:
            - dbpostgresql
            - message.broker.rabbitmq
            - redis
    marketapi:
        build:
            context: .
            dockerfile: ./market.api/Dockerfile
            args:
                GITHUB_PACKAGES_USERNAME: ${GITHUB_PACKAGES_USERNAME}
                GITHUB_PACKAGES_TOKEN: ${GITHUB_PACKAGES_TOKEN}
        container_name: market-api
        ports:
            - "9503:8080"
        networks: 
            - market-network
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
        volumes:
            - uploads:/app/Uploads
        depends_on:
            - dbpostgresql
            - message.broker.rabbitmq
            - redis

    accountsloginweb:
        build:
            context: ./accounts.login.web
            dockerfile: Dockerfile
        container_name: accounts.login.web
        ports:
            - "9001:8080"
        networks: 
            - market-network
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
        depends_on:
            - dbpostgresql
            - message.broker.rabbitmq
            - redis
            - accountsapi

    accountsmanagementweb:
        build:
            context: ./accounts.management.web
            dockerfile: Dockerfile
        container_name: accounts.management.web
        ports:
            - "9002:8080"
        networks: 
            - market-network
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
        depends_on:
            - dbpostgresql
            - message.broker.rabbitmq
            - redis
            - accountsloginweb
    marketweb:
        build:
            context: ./market.web
            dockerfile: Dockerfile
        container_name: market.web
        ports:
            - "9003:80"
        networks: 
            - market-network
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
        depends_on:
            - marketapi

    apigateway:
        image: nginx:1.27-alpine
        container_name: api-gateway
        ports:
            - "80:80"
        networks:
            - market-network
        volumes:
            - ./infra/nginx:/etc/nginx/conf.d:ro
        depends_on:
            - userapi
            - accountsapi
            - fileapi
            - marketapi
            - accountsloginweb
            - accountsmanagementweb
            - marketweb
volumes:
    cache:
        driver: local
    uploads:
        driver: local
    db_postgresql:
        driver: local
    rabbitmq_data:
        driver: local
        
networks:
  market-network:
    driver: bridge
